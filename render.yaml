# Render blueprint — one web service serving both the API and the built client.
#
# Deploy from the dashboard: New > Blueprint, point it at this repo.
# DATABASE and DATABASE_PASSWORD are marked sync:false, so Render prompts for
# them instead of storing secrets in git.
services:
  - type: web
    name: summer-question-bingo
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # The custom domain(s) the browser arrives from. The onrender.com origin
      # is trusted automatically via RENDER_EXTERNAL_URL; anything else must be
      # listed here or the page loads but the socket is refused (CORS 400).
      - key: CLIENT_ORIGIN
        value: https://www.bingo.shekel-pnai.org,https://bingo.shekel-pnai.org
      # Never guessed: paste your Atlas URI (keep the literal <PASSWORD> token).
      - key: DATABASE
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Gates the answer key, the roster and the audit trail. Generate a strong one.
      - key: ADMIN_KEY
        generateValue: true
      # Human login for the /admin page. Set both in the dashboard.
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STOP_ON_WIN
        value: 'true'
      - key: STRICT_MARKS
        value: 'true'
      - key: FORBIDDEN_DATABASES
        value: yitav,test,admin,local
